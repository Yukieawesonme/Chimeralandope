<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>ChimeraLand — Protótipo Jogável</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07111f; }
      body { font-family: Inter, system-ui, sans-serif; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; inset: 0; pointer-events: none; color: white;
        text-shadow: 0 2px 5px rgba(0,0,0,.8); padding: 16px;
      }
      #top { display: flex; justify-content: space-between; align-items: flex-start; }
      .bar { width: min(280px, 42vw); height: 18px; border: 2px solid rgba(255,255,255,.75); border-radius: 12px; background: rgba(0,0,0,.45); overflow: hidden; }
      #healthFill { height: 100%; width: 100%; background: linear-gradient(90deg,#ef4444,#fb7185); transition: width .15s; }
      #gameTitle { font-weight: 800; letter-spacing: .08em; font-size: clamp(12px,2vw,18px); }
      #stats { margin-top: 6px; font-weight: 700; }
      #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%) translateY(-10px); opacity: 0; background: rgba(7,17,31,.88); border: 1px solid #42d9c5; border-radius: 999px; padding: 9px 18px; transition: .25s; font-weight: 700; }
      #toast.show { opacity: 1; transform: translateX(-50%); }
      #start {
        position: fixed; inset: 0; display: grid; place-items: center; background:
          radial-gradient(circle at 50% 40%, rgba(53,203,178,.18), transparent 30%), #07111f;
        color: white; z-index: 10;
      }
      #startCard { text-align: center; max-width: 600px; padding: 28px; }
      #start h1 { margin: 0 0 8px; font-size: clamp(38px,8vw,72px); letter-spacing: -.05em; }
      #start p { color: #b6c3d2; margin: 0 auto 22px; line-height: 1.6; }
      #play { border: 0; border-radius: 12px; background: #42d9c5; color: #07111f; font-size: 18px; font-weight: 900; padding: 14px 28px; cursor: pointer; }
      #controls { position: fixed; inset: 0; pointer-events: none; display: none; }
      .mobileBtn { pointer-events: auto; position: absolute; width: 76px; height: 76px; border: 2px solid rgba(255,255,255,.35); border-radius: 50%; background: rgba(7,17,31,.52); color: white; font-size: 28px; }
      #attackBtn { right: 24px; bottom: 28px; background: rgba(239,68,68,.65); }
      #dashBtn { right: 112px; bottom: 18px; }
      #joystick { left: 28px; bottom: 28px; width: 120px; height: 120px; border: 2px solid rgba(255,255,255,.25); border-radius: 50%; background: rgba(7,17,31,.35); }
      #stick { position: absolute; width: 54px; height: 54px; left: 33px; top: 33px; border-radius: 50%; background: rgba(255,255,255,.72); }
      @media (pointer: coarse) { #controls { display: block; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="top">
        <div><div id="gameTitle">CHIMERALAND</div><div class="bar"><div id="healthFill"></div></div><div id="stats">VIDA 100 · PONTOS 0</div></div>
        <div id="time">DIA 1</div>
      </div>
      <div id="toast"></div>
    </div>
    <div id="controls">
      <div id="joystick"><div id="stick"></div></div>
      <button id="dashBtn" class="mobileBtn">➤</button>
      <button id="attackBtn" class="mobileBtn">⚔</button>
    </div>
    <div id="start">
      <div id="startCard">
        <h1>ChimeraLand</h1>
        <p>Explore a planície, derrote criaturas espirituais e sobreviva o máximo que puder.<br><b>WASD / setas</b> para mover · <b>mouse</b> para mirar · <b>clique / Espaço</b> para atacar · <b>Shift</b> para avançar.</p>
        <button id="play">JOGAR</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
